name: Daily education news

on:
  schedule:
    # 台灣時間 08:23（UTC 00:23）。刻意避開整點，因為整點最容易被 GitHub 延遲或丟掉
    - cron: "23 0 * * *"
    # 備援：台灣時間 14:23。上午那次成功的話，這次只會補抓新出現的文章；上午漏掉也能補上
    - cron: "23 6 * * *"
  workflow_dispatch: # 允許手動按鈕執行，測試與補跑用

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and summarize
        run: python fetch_edu_news.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit results
        if: always() # 即使上一步報錯，已蒐集到的部分也要存起來
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          git pull --rebase
          git push
